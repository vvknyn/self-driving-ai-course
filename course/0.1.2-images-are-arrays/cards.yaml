- id: c1
  front: "What is the shape of one camera frame, and what does each axis mean?"
  back: "(180, 320, 3): 180 rows from top to bottom, 320 columns from left to right, and 3 colour values, red, green and blue."
- id: c2
  front: "Where is row 0 of an image?"
  back: "At the top. Rows count down the picture, like lines of text."
- id: c3
  front: "What does uint8 mean, and what values can it hold?"
  back: "An unsigned 8-bit integer: whole numbers from 0 to 255, with no minus sign."
- id: c4
  front: "What does `frame[100:180]` give?"
  back: "Rows 100 to 179, because the stop is left out: shape (80, 320, 3)."
- id: c5
  front: "How do you measure how alike two colours are?"
  back: "Treat them as points in the red-green-blue cube and take the straight-line distance: the square root of the sum of the squared channel differences."
- id: c6
  front: "Why can't you find paint with `frame == yellow`?"
  back: "Noise nudges every channel, so a paint pixel is almost never exactly its colour. Test whether it is close enough instead: distance < τ."
- id: c7
  front: "How do you choose the threshold τ?"
  back: "Look at the distances. τ must sit in the gap between the furthest paint pixel and the nearest pixel that is not paint. The provided box uses 60."
- id: c8
  front: "What is IoU?"
  back: "Intersection over union: the pixels marked in both masks, divided by the pixels marked in either. 1 means identical, 0 means no overlap."
- id: c9
  front: "Why not score a mask by the share of pixels it gets right?"
  back: "Paint is only a sliver of the frame (the yellow line is 1.2% of it), so a mask that marks nothing gets 98.8% right. Its IoU is 0."
- id: c10
  front: "What is 90 − 230 in uint8, and how do you avoid it?"
  back: "116: the result wraps around by 256, with no error. Convert with `astype(float)` before you subtract."
