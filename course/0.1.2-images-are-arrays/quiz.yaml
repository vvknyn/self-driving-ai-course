- id: q1
  type: mcq
  prompt: "A frame has shape `(180, 320, 3)`. How many numbers does it hold?"
  choices:
    - "57,600"
    - "960"
    - "172,800"
    - "503"
  answer: 2
  explain: "A frame holds $180 \\times 320 \\times 3 = 172{,}800$ numbers: 57,600 pixels, each with three colour values. 57,600 counts the pixels only."
  section: a-frame-is-a-grid-of-numbers
- id: q2
  type: mcq
  prompt: "Which pixel is `frame[0, 319]`?"
  choices:
    - "the top-right corner"
    - "the top-left corner"
    - "the bottom-right corner"
    - "the bottom-left corner"
  answer: 0
  explain: "The first index is the row and row 0 is the top; the second is the column and column 319 is the last, on the right. So row 0, column 319 is the top-right corner."
  section: finding-one-pixel-row-column-channel
- id: q3
  type: mcq
  prompt: "Yellow paint is (230, 200, 40) and road is (90, 90, 95). In the blue-channel image `frame[:, :, 2]`, how does the yellow line look?"
  choices:
    - "brighter than the road"
    - "the same brightness as the road"
    - "brighter than the sky"
    - "darker than the road"
  answer: 3
  explain: "Blue is the third value: 40 for yellow, 95 for road. A smaller value is darker, so in the blue channel the yellow line is darker than the road, while in red and green it is brighter."
  section: finding-one-pixel-row-column-channel
- id: q4
  type: mcq
  prompt: "What is the shape of `frame[100:180]`?"
  choices:
    - "(100, 320, 3)"
    - "(80, 320, 3)"
    - "(81, 320, 3)"
    - "(180, 320, 3)"
  answer: 1
  explain: "The stop is left out: rows 100 to 179, which is $180 - 100 = 80$ rows. Columns and colours are untouched."
  section: slicing-taking-a-block-of-rows
- id: q5
  type: mcq
  prompt: "What is the distance between the colours (0, 0, 0) and (3, 4, 12)?"
  choices:
    - "19"
    - "169"
    - "13"
    - "12"
  answer: 2
  explain: "$\\sqrt{3^2 + 4^2 + 12^2} = \\sqrt{9 + 16 + 144} = \\sqrt{169} = 13$. 169 is the sum before the root; 19 adds the differences without squaring."
  section: colour-is-a-point-in-space
- id: q6
  type: mcq
  prompt: "Which simulator colour is closest to white paint, and so the most likely to be mistaken for it?"
  choices:
    - "sky"
    - "road"
    - "grass"
    - "yellow paint"
  answer: 0
  explain: "White to sky is 116.4; to yellow paint 204.2, to road 257.0 and to grass 270.9. The nearest colour is the one a loose threshold would mistake for white first."
  section: colour-is-a-point-in-space
- id: q7
  type: mcq
  prompt: "With `noise_sigma=6`, about what share of the nudges lie between −6 and +6?"
  choices:
    - "all of them"
    - "about 7 in 10"
    - "about 1 in 15"
    - "about 1 in 100"
  answer: 1
  explain: "Measured on a frame, 72.1% of nudges fall within one $\\sigma$ of zero. Almost all (99.8%) fall within $\\pm 18$, but not literally all of them."
  section: noise-no-two-pixels-quite-alike
- id: q8
  type: mcq
  prompt: "Why does `frame == yellow` find almost no yellow pixels in a noisy frame?"
  choices:
    - "noise turns yellow pixels into grass"
    - "`==` only works on float arrays"
    - "the simulator paints yellow differently on each road"
    - "all three channels' nudges must round to exactly 0, and each does so only about 1 time in 15"
  answer: 3
  explain: "A channel survives only if its nudge rounds to 0, which at $\\sigma = 6$ is about 0.066, or 1 in 15. All three must survive: about $0.066^3 \\approx 0.0003$."
  section: the-tempting-shortcut-exact-equality
- id: q9
  type: mcq
  prompt: "Which threshold for white paint would also mark sky pixels in the noisy frame?"
  choices:
    - "40"
    - "60"
    - "120"
    - "80"
  answer: 2
  explain: "White paint pixels are at most 24.8 from white, and the nearest sky pixel is 92.2 away. Any threshold between those two is safe, which includes 40, 60 and 80; 120 reaches past the sky."
  section: paint-is-a-colour-threshold
- id: q10
  type: mcq
  prompt: "`frame` has shape (180, 320, 3) and `yellow` has shape (3,). What is the shape of `np.linalg.norm(frame - yellow, axis=-1)`?"
  choices:
    - "(180, 320)"
    - "(180, 320, 3)"
    - "(3,)"
    - "(57600,)"
  answer: 0
  explain: "Broadcasting subtracts yellow from every pixel and keeps the shape (180, 320, 3). Taking the length along the last axis, the colour axis, leaves one distance per pixel: (180, 320)."
  section: paint-is-a-colour-threshold
- id: q11
  type: mcq
  prompt: "A mask marks 6 of the 10 true paint pixels, plus 2 pixels that are not paint. What is its IoU?"
  choices:
    - "0.6"
    - "0.75"
    - "0.8"
    - "0.5"
  answer: 3
  explain: "Both: 6. Either: $6 + 4 + 2 = 12$ (6 right, 4 missed, 2 wrong). $6 / 12 = 0.5$. 0.6 is the share of the paint found, which ignores the false marks."
  section: scoring-a-mask-with-iou
- id: q12
  type: mcq
  prompt: "Both arrays are uint8. A road pixel's red is 90 and yellow's red is 230. What does `frame - yellow` give for that channel?"
  choices:
    - "−140"
    - "116"
    - "0"
    - "an OverflowError"
  answer: 1
  explain: "uint8 arithmetic wraps around by 256: $90 - 230 = -140$, and $-140 + 256 = 116$. NumPy raises no error for array subtraction, so the bug is silent."
  section: the-uint8-wraparound-trap
