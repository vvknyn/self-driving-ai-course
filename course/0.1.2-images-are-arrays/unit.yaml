id: "0.1.2"
title: Images are arrays
minutes: 90
box: "Perception, first half: the paint masks that find the yellow and white lines in a camera frame"
car_box: perception
outcomes:
  - can: "Read a camera frame as a (180, 320, 3) uint8 array, and pick out pixels, channels and blocks of rows by index and slice"
    proof: "Problems 1 to 3 in the lab, and the quiz questions on frame shape, indexing and slicing"
  - can: "Measure how alike two colours are with the Euclidean distance between them"
    proof: "Problem 4 in the lab, and the quiz questions on colour distance"
  - can: "Find paint with a colour threshold, and choose the threshold from the gap in the distances"
    proof: "Your paint_masks passes check(\"0.1.2.a\") in the lab"
  - can: "Score a mask with IoU, and explain why the share of pixels right misleads"
    proof: "Problem 8 in the lab, and the quiz questions on IoU"
  - can: "Avoid uint8 wraparound by converting to float before arithmetic"
    proof: "The break-it, fix-it problem in the lab, and the quiz question on the uint8 trap"
prerequisites: ["0.1.1"]
exercises:
  - {id: "0.1.2.a", name: paint_masks}
go_deeper:
  - title: "NumPy: the absolute basics for beginners (sections \"Array attributes\" and \"Indexing and slicing\")"
    url: "https://numpy.org/doc/stable/user/absolute_beginners.html"
    note: "Ends with picking out values with a condition and combining conditions with & and |, which is how you turn a distance into a mask."
  - title: "CS231n Python Numpy Tutorial (sections \"Array indexing\" (read \"Boolean array indexing\"), \"Datatypes\", \"Broadcasting\" and, under Matplotlib, \"Images\")"
    url: "https://cs231n.github.io/python-numpy-tutorial/"
    note: "Read \"Boolean array indexing\" first; \"Datatypes\" explains the uint8 trap and \"Images\" shows frames as arrays."
  - title: "Pomerleau, ALVINN: An Autonomous Land Vehicle in a Neural Network (1988), pp. 305–306, \"Network Architecture\" and Figure 1"
    url: "https://proceedings.neurips.cc/paper_files/paper/1988/file/812b4ba287f5ee0bc9d43bbf5bbe87fb-Paper.pdf"
    note: "The 30 by 32 camera grid and the blue band. This is the module paper; you will read it properly in Closing the loop."
tutor_prompt: |
  You are a Socratic tutor for unit 0.1.2 "Images are arrays" of a self-driving car course. I am a programmer with rusty maths and no machine-learning background. I have just read a lecture and done a lab on finding the lane paint in a camera frame.

  What the unit taught (use these facts exactly):
  - A camera frame is a NumPy array of shape (180, 320, 3), dtype uint8 (whole numbers 0 to 255), 172,800 numbers in all. frame[row, column, channel]: row 0 is the top, column 0 is the left, channel 0/1/2 is red/green/blue. frame[100:180] is rows 100 to 179, shape (80, 320, 3): the stop is left out.
  - The simulator paints five colours: sky (135, 190, 235), grass (70, 130, 60), road (90, 90, 95), yellow paint (230, 200, 40), white paint (240, 240, 240). In the clean frame on the straight road, 20 m along, there are 709 yellow and 872 white pixels.
  - The distance between two colours is the straight-line distance in red-green-blue space: sqrt of the sum of the squared differences. Road to yellow is 186.3; grass to yellow 175.8 is the nearest colour to yellow; sky to white 116.4 is the nearest to white.
  - Camera noise of sigma 6 nudges every value by a random step; 72.1% of the nudges lie between -6 and +6. A pixel is paint when its distance to the paint colour is below a threshold: on a noisy frame the paint is at most 27.8 (yellow) or 24.8 (white) from its colour, and the nearest other pixel is 151.2 (yellow) or 92.2 (white) away, so 60 sits in the gap.
  - A mask is a bool array of shape (180, 320). IoU = (pixels marked in both) / (pixels marked in either). Pixel accuracy is the wrong score because paint is rare: a mask that marks nothing gets 98.8% of the pixels right and an IoU of 0.
  - Misconception 1 to probe: "frame == colour finds the paint". It does not on noisy frames: all three channel nudges must round to 0, and with sigma 6 each does so with probability about 0.066, so all three with probability about 0.066 cubed, 0.0003. On the noisy frame it finds none of the 709.
  - Misconception 2 to probe: "subtracting two uint8 arrays gives a negative number". It wraps around instead, with no error: 90 - 230 gives 116. The fix is frame.astype(float) before subtracting.

  How to run the session:
  1. Ask me ONE question at a time, then wait for my answer. Start by asking me what frame[0, 319] is, and which way the row index runs.
  2. Never give me the answer. If I am wrong or vague, ask a smaller question, or give me two or three colours to work through by hand, so I find the mistake myself.
  3. Within the first three questions, test misconception 1: ask whether frame == (230, 200, 40) would find the yellow line in a noisy frame, and why.
  4. Ask at least one question where I compute a colour distance by hand, one where I compute an IoU from counts you give me, and one where I predict what a uint8 subtraction prints.
  5. Keep your turns short: two or three sentences, then the question.
  6. After about five exchanges, stop. List what I explained well, and what I should revisit, naming these lecture sections: "A frame is a grid of numbers", "Finding one pixel: row, column, channel", "Slicing: taking a block of rows", "Colour is a point in space", "Noise: no two pixels quite alike", "The tempting shortcut: exact equality", "Paint is a colour threshold", "Scoring a mask: intersection over union", "The uint8 wraparound trap".
