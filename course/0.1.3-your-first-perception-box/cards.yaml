- id: c1
  front: "Where is the horizon in the camera image, and why?"
  back: "Row $c_y - f \\tan p = 89.5 - 160 \\tan 5° = 75.5$. A ray parallel to the ground points $p$ above the camera's axis. Rows above it see sky; rows below see road."
- id: c2
  front: "How far ahead is the ground seen in image row $v$ on a flat road?"
  back: "The ray falls $\\theta = p + \\arctan\\frac{v - c_y}{f}$ below horizontal and starts $h$ up, so $d = h / \\tan\\theta$. Row 150 gives 2.907 m. The column does not matter: a row is a distance."
- id: c3
  front: "How many metres of ground does one pixel column cover?"
  back: "About $d / f$, where $d$ is how far ahead that row sees (exactly $Z / f$ for the slant distance $Z$): 0.01886 m in row 150, 0.05737 m in row 100. There is no fixed metres-per-column; you need the row too."
- id: c4
  front: "How do you turn a paint mask in a band of rows into a ground point?"
  back: "`np.nonzero(mask[a:b])` gives rows and columns; add the band's start row `a` to the mean row, take the mean column, then `pixel_to_ground(u, v)` (column first). The centroid of a thin line lies on the line."
- id: c5
  front: "Given the lane-centre points $(d_1, c_1)$ and $(d_2, c_2)$, what are the offset and the heading?"
  back: "$\\text{slope} = (c_2 - c_1) / (d_2 - d_1)$, $\\text{offset} = -(c_1 - \\text{slope} \\cdot d_1)$, $\\text{heading} = -\\arctan(\\text{slope})$. The minus signs switch from the lane seen by the car to the car seen by the lane."
- id: c6
  front: "What does `estimate_lane` return when a band has fewer than 3 pixels of a line?"
  back: "`LaneEstimate(math.nan, math.nan, False)`: fewer than `MIN_PIXELS` = 3 pixels of either line in either band. Never `0.0, 0.0`: that claims the car is centred and aligned."
- id: c7
  front: "Why is a two-point straight-line lane estimate wrong on a bend, even with the car perfectly placed?"
  back: "The line through two points on a curve is a chord: offset $\\approx d_1 d_2 / (2R)$, heading $\\approx -\\arctan\\frac{d_1 + d_2}{2R}$. On `gentle` ($R = 81.8$ m) that is 0.119 m and -0.0604 rad by formula, 0.129 m and -0.0645 rad measured, the same every frame. A bias, not noise."
- id: c8
  front: "What does a flipped sign in the offset do to the car?"
  back: "Positive feedback: the controller steers away from the centre, so the error grows 1.8 to 1.9 times every half second from 2 s on, and the car crosses the white line at 5.00 s, 39.9 m along the first straight."
