- id: q1
  type: numeric
  prompt: "The camera has focal length $f = 160$ pixels, centre row $c_y = 89.5$, and is tipped down by $5°$. In which row is the horizon? (Give a decimal row.)"
  answer: 75.5
  tolerance: 0.1
  explain: "A ray parallel to the ground points $5°$ above the camera's axis, so it lands $f \\tan 5° = 160 \\times 0.0875 = 14.0$ rows above the centre: $89.5 - 14.0 = 75.5$. Every row above it sees sky."
  section: the-horizon
- id: q2
  type: numeric
  prompt: "How far ahead, in metres, is the ground seen in row 170? The camera is $h = 1.4$ m up, pitch $5°$, $f = 160$, $c_y = 89.5$."
  answer: 2.266
  tolerance: 0.01
  explain: "$(170 - 89.5) / 160 = 0.503$ and $\\arctan 0.503 = 26.71°$, so $\\theta = 5° + 26.71° = 31.71°$. Then $d = 1.4 / \\tan 31.71° = 1.4 / 0.618 = 2.27$ m. Rows lower in the image see ground closer to the car."
  section: rows-are-distances
- id: q3
  type: mcq
  prompt: "In row 150 one pixel column covers 0.0189 m of ground. A teammate uses that number in every row. In row 100, where the ground is 9.09 m ahead, what happens to a sideways distance?"
  choices:
    - "It comes out right: the lane is the same width in every row."
    - "It comes out about 3 times too big, because far-away paint looks wider."
    - "It comes out about 3 times too small, because one column in row 100 covers 0.057 m, not 0.019 m."
    - "It comes out right for the white line but wrong for the yellow one."
  answer: 2
  explain: "One column covers about $d / f$ metres of ground, so it depends on the row: 0.01886 m in row 150, 0.05737 m in row 100. A 0.5 m slide moves the paint 9.0 columns in row 100; at 0.0189 m per column that reads as 0.17 m. A pixel column is not a fixed number of metres."
  section: metres-per-pixel
- id: q4
  type: mcq
  prompt: "Why does the box look at a band of rows (rows 125 to 179 near, 95 to 115 far) and not at a single row?"
  choices:
    - "A band is faster to compute."
    - "A single row can fall in the 1.5 m gap between two dashes and see no paint; a band covers more road (2.38 m near, 5.86 m far) than a gap."
    - "A single row cannot be turned into a distance."
    - "The camera only reports whole bands of rows."
  answer: 1
  explain: "The dashed line has gaps of 1.5 m. One row sees one slice of ground and can land entirely in a gap. A band of rows covers 2.38 m of road near the car and 5.86 m far away, so it always catches some paint."
  section: two-bands-of-rows
- id: q5
  type: numeric
  prompt: "Your box finds the near lane-centre point at $(d_1, c_1) = (2.710, -0.530)$ and the far one at $(d_2, c_2) = (7.189, -0.759)$, in metres (forward, left). What is `offset_m`? (Give metres, positive when the car is left of the lane centre.)"
  answer: 0.391
  tolerance: 0.002
  explain: "The slope is $(-0.759 + 0.530) / (7.189 - 2.710) = -0.0511$. The line reaches the car ($d = 0$) at $c_1 - \\text{slope} \\cdot d_1 = -0.530 + 0.0511 \\times 2.710 = -0.391$: the lane centre is 0.391 m to the car's right, so the car is 0.391 m left of it. $\\text{offset} = -(-0.391) = +0.391$ m. The heading is $-\\arctan(-0.0511) = +0.0511$ rad."
  section: from-masks-to-a-lane-estimate
- id: q6
  type: mcq
  prompt: "A frame has no white paint in the near band. What should `estimate_lane` return?"
  choices:
    - "`LaneEstimate(0.0, 0.0, True)`, the safest guess."
    - "The estimate from the previous frame, marked valid."
    - "`LaneEstimate(nan, nan, False)`: there is no estimate, and the box says so."
    - "`LaneEstimate(0.0, 0.0, False)`."
  answer: 2
  explain: "Zero offset and zero heading claim the car is centred and aligned, and the controller would believe it. With `valid=False` and `nan`, nothing can mistake the missing estimate for a measurement. The turned car in the lecture (0.6 rad left) has 0 white pixels in the near band."
  section: what-validfalse-is-for
- id: q7
  type: mcq
  prompt: "The car sits exactly on the lane centre, aligned, on a left bend of `gentle`. What does the two-band box say?"
  choices:
    - "Right of centre and pointing left, by a different amount every frame."
    - "Nothing wrong: the box reports 0 m and 0 rad."
    - "Left of centre (+0.129 m) and pointing right (-0.0645 rad), the same every frame: the chord bias of a straight line on a curve."
    - "Right of centre (-0.129 m) and pointing right, because the bend is to the left."
  answer: 2
  explain: "The straight line through two points on a bend is a chord. It meets the car's axis to the left of the true centre and tilts to the right. The lecture's formula gives 0.119 m and -0.0604 rad for the radius 81.8 m; the box measures 0.129 m and -0.0645 rad, the same in every frame. It is a bias, not noise."
  section: straight-roads-only
- id: q8
  type: mcq
  prompt: "Same road, seed, speed and controller, but the perception is perfect (it is given the truth). On `gentle` the mean $|e|$ is 0.113 m. What was it with the two-band box?"
  choices:
    - "0.113 m, the same: the controller decides everything."
    - "0.376 m: most of the error belongs to the box's chord bias, not the controller."
    - "0.05 m."
    - "The car left the lane."
  answer: 1
  explain: "The two-band box rides about 0.5 m off the lane centre in every bend, a mean of 0.376 m over the lap. With the truth fed to the same controller it is 0.113 m. On `curvy` the two-band box leaves the lane at 48.3 m of 218.5 m, while the perfect box completes it at 0.348 m."
  section: swap-your-perception-into-the-car
