- id: q1
  type: mcq
  prompt: The provided car's steering on `gentle` is recorded and replayed without the camera, with the wheel 0.002 rad off. The replay leaves the road after 8.40 s; the provided car with the same error completes the lap. Why?
  choices:
  - The replay runs slower than the live car, so the timing drifts.
  - 0.002 rad is too small to matter; the replay must have a bug.
  - 'The replay is open loop: nothing measures the error, so it adds up. The live car measures the offset every 0.05 s and steers against it.'
  - The live car's perception box cancels the 0.002 rad before it reaches the wheel.
  answer: 2
  explain: 'The exact replay drives the identical lap, so the recording is fine. With a constant 0.002 rad error, every step the open-loop car drifts a little further and nothing notices. The closed-loop car sees the drift in its next estimate and steers against it: over the same 8.4 s it never strays more than 0.0074 m from the centre. The error is still there; feedback corrects its effect, whatever caused it.'
  section: open-loop-and-closed-loop
- id: q2
  type: mcq
  prompt: '`p_steer` gets `LaneEstimate(offset_m=0.4, heading_rad=0.05, valid=True)` with `k_off = 0.35` and `k_head = 2.7`. What does it return, in radians?'
  choices:
  - $-0.14$ rad
  - $+0.275$ rad
  - $-0.5$ rad
  - $-0.275$ rad
  answer: 3
  explain: '$\delta = -(0.35 \times 0.4 + 2.7 \times 0.05) = -(0.14 + 0.135) = -0.275$ rad: both errors are to the left, so the wheel turns right, against both. $+0.275$ has the signs flipped, $-0.14$ forgets the heading term, and $-0.5$ is the clip, which only applies when the sum is larger than 0.5.'
  section: the-p-controller
- id: q3
  type: mcq
  prompt: In the push test the car comes back to the centre with no swing when the heading gain is 1. What does the steering law do at that gain?
  choices:
  - It steers the wheels straight ahead whatever the offset.
  - It makes the wheels point $-k_{\text{off}}$ times the offset away from the lane's direction, whatever the heading.
  - It ignores the offset term.
  - It doubles the offset term.
  answer: 1
  explain: 'The wheels'' angle $\delta$ plus the heading $\psi$ is the direction of the front wheels relative to the lane. With $k_{\text{head}} = 1$ the law gives $\psi + \delta = -k_{\text{off}}\, e$: the wheels aim at the centre line in proportion to the offset, whatever the car''s own heading. A smaller gain lets the car arrive pointing across the lane; a larger one slows the return.'
  section: how-the-heading-gain-shapes-the-return
- id: q4
  type: numeric
  prompt: A perfect box and the P law at 0.35 and 2.7 on `curvy`'s left bend, where the wheel angle that holds the circle is $\delta = +0.1242$ rad. What offset does the car carry in the bend, in metres (left positive)?
  answer: 0.603
  tolerance: 0.005
  explain: '$e = (k_{\text{head}} - 1)\,\delta / k_{\text{off}} = 1.7 \times 0.1242 / 0.35 = +0.603$ m. A perfect box still leaves this offset: the P law needs an error to produce the wheel angle that holds the bend.'
  section: holding-a-bend
- id: q5
  type: mcq
  prompt: On `curvy`'s left bend the provided car's box has an offset bias and a heading bias, and the car ends up predicted +2.039 m from the centre. The yellow line is 1.8 m away. Which error does most of the damage, and why?
  choices:
  - 'The heading bias: the law multiplies heading by 2.7 and offset by 0.35, so a heading error counts 7.71 m per radian.'
  - 'The offset bias: the box reports the car too far left.'
  - The wheel's speed limit.
  - The 0.5 rad clip.
  answer: 0
  explain: The heading bias. The law multiplies heading by 2.7 and offset by only 0.35, so in a bend each radian of heading error counts as much as $2.7 / 0.35 = 7.71$ m of offset error. The box's heading is far from the truth on a tight bend, so it pushes the car 1.994 m toward the inside, more than the 0.603 m the law itself carries and the 0.558 m the offset bias cancels.
  section: why-the-provided-car-leaves-curvy
- id: q6
  type: mcq
  prompt: On `gentle` the provided box and $k_{\text{head}} = 2.7$, raising $k_{\text{off}}$ to 6.0 leaves the road after 4.30 s. With the wheel's speed limit lifted the same gains finish the lap. What does that show?
  choices:
  - The law is wrong at high gain.
  - The simulator has a bug at 6.0.
  - The perception box fails at 4.30 s.
  - The wheel's speed limit makes high-gain corrections late, so the swings grow.
  answer: 3
  explain: The wheels can turn at most 0.05 rad per step. At a high gain a few centimetres of offset ask for a large change of steering, the wheels move at full rate in most steps and are always late, and each swing is wider than the last. Lift the limit and the same law works, which shows the limit, not the law, caps the useful gain.
  section: too-much-gain
- id: q7
  type: mcq
  prompt: ALVINN's network was trained to output a steering direction. Which target did Pomerleau describe for it (p. 306)?
  choices:
  - The wheel angle of the previous frame.
  - The road centre 7 m ahead.
  - The distance to the yellow line.
  - The car's speed.
  answer: 1
  explain: The target was the steering that "would bring the vehicle to the road center 7 meters ahead of its current position". Aiming at a point ahead is lookahead; the next lesson moves such a point between frames.
  section: a-1988-car-that-learned-to-steer
