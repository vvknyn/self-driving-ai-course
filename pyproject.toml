[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2fsd"
version = "0.1.0"
description = "Zero2FSD v2: a small self-driving-car simulator, provided boxes and grader for the course labs"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSE-content", "NOTICE"]
authors = [{ name = "Vivek Narayanan" }]
dependencies = ["numpy", "pillow", "matplotlib", "pyyaml"]

[project.urls]
Homepage = "https://zero2fsd.com"
Repository = "https://github.com/vvknyn/self-driving-ai-course"

[project.optional-dependencies]
dev = ["pytest", "nbformat"]
test = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["zero2fsd*"]
