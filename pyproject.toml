[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2fsd"
version = "0.1.0"
description = "Zero2FSD v2: a small self-driving-car simulator, provided boxes and grader for the course labs"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "nbformat"]

[tool.setuptools.packages.find]
include = ["zero2fsd*"]
